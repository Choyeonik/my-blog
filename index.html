<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yeonnnn's Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<!-- 공용 스타일시트: index.html / write.html / posts/*.html 모두 이 파일 하나를 공유합니다 -->
<link rel="stylesheet" href="site.css">
</head>
<body>

<div class="layout">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">

    <!-- 사이드바 최소화(토글) 버튼: 사이드바 안쪽 오른쪽 위에 고정.
         클릭하면 JS에서 body에 "sidebar-collapsed" 클래스를 붙였다 뗐다 하면서
         사이드바를 좁게 접거나 다시 펼칩니다. -->
    <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="사이드바 접기/펼치기">
      <span></span>
      <span></span>
      <span></span>
    </button>


    <!-- 글쓰기 / 설정 페이지로 이동 -->
    <div class="sidebar-links">
      <a href="write.html" class="write-link">새 글 쓰기 →</a>
      <a href="settings.html" class="write-link">설정 →</a>
    </div>

    <!-- 나의 프로필 -->
    <section class="profile">
      <div class="profile-avatar">
        <img id="sidebarAvatar" src="assets/profile-photo.jpg" alt="프로필 사진">
      </div>
      <h2 class="profile-name">Hello, Yeonnnn!</h2>
      <p class="profile-title">Yeonnnn</p>
      <p class="profile-bio">
      </p>
      <div class="profile-links">
        <a href="https://instagram.com/whyeonik" target="_blank" rel="noopener">Instagram</a>
        <a href="mailto:zging0151@gmail.com">Email</a>
        <a href="https://github.com/Choyeonik" target="_blank" rel="noopener">Github</a>
      </div>
    </section>

    <!-- 검색창 -->
    <section class="search-box">
      <input type="text" id="searchInput" placeholder="검색어를 입력하세요">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </section>

    <!-- 카테고리 -->
    <section class="categories">
      <div class="side-heading">Category</div>
      <ul class="category-list">
        <li>
          <div class="category-total active" data-filter="total">
            <span>Total</span>
            <span class="count" id="totalCount">0</span>
          </div>
          <!-- 카테고리 목록은 site-config.json(설정 페이지에서 관리)을 기준으로 JS가 채웁니다 -->
          <ul class="category-sub" id="categorySubList"></ul>
        </li>
      </ul>
    </section>

    <!-- 최근 글 -->
    <section class="recent-posts">
      <div class="side-heading">최근 글</div>
      <ul class="recent-list" id="recentList"></ul>
    </section>

    <!-- 작업 폴더(posts) 연결 상태 —
         버튼을 누르면 실제 작업 폴더를 선택하고, 그 안의 posts/manifest.json을
         읽어서 아래 예시 글 대신 실제로 작성한 글들을 보여줍니다.
         (write.html에서 저장한 글이 여기에 나타납니다) -->
    <section class="folder-connect" id="folderConnect">
      <button type="button" id="connectFolderBtn">폴더 연결해서 실제 글 불러오기</button>
    </section>

  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <div class="main-inner">

      <div class="main-header">
        <h1 id="pageTitle">Total</h1>
		  <br>
      </div>

      <div class="grid" id="grid">
        <!-- cards injected by JS -->
      </div>

    </div>
  </main>

</div>

<!-- posts 폴더 읽기/쓰기 공용 헬퍼 (site-storage.js) -->
<script src="site-storage.js"></script>

<script>
  // 네트워크 연결 여부와 상관없이 항상 보이도록, 외부 이미지 대신
  // 인라인 SVG로 생성한 무채색 플레이스홀더 썸네일을 사용합니다.
  function hashSeed(str){
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h;
  }

  // 썸네일 세로 비율(높이/너비) 후보. 실제 사진처럼 카드마다 사진 높이가
  // 들쭉날쭉하도록 seed 값에 따라 이 중 하나를 골라 씁니다.
  // (카드 "전체 영역" 높이를 맞추는 것은 CSS Grid의 행(row) 정렬이 담당하고,
  //  여기서는 사진 자체의 높이만 다르게 만듭니다 — 레퍼런스와 동일한 방식)
  const THUMB_RATIOS = [0.8, 1.0, 1.15, 1.3, 1.5, 0.65];

  // 게시글 seed로부터 이 게시글 썸네일의 세로 비율을 정함 (같은 seed면 항상 같은 값)
  function pickThumbRatio(seed){
    const n = hashSeed(String(seed));
    return THUMB_RATIOS[n % THUMB_RATIOS.length];
    return THUMB_RATIOS[n % THUMB_RATIOS.length];
  }

  function placeholderDataUri(seed, w){
    w = w || 400;
    const h = Math.round(w * pickThumbRatio(seed));
    const n = hashSeed(String(seed));
    const bg = 224 + (n % 12);                 // 224~235 사이 밝은 회색
    const line = 176 + ((n >> 3) % 16);        // 176~191 사이 회색 선
    const shapeType = n % 3;
    const cx = w * (0.28 + (n % 44) / 100);
    const cy = h * (0.28 + ((n >> 5) % 44) / 100);
    const r = Math.min(w, h) * 0.2;
    let shape;
    if (shapeType === 0){
      shape = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgb(${line},${line},${line})" stroke-width="1.5"/>`;
    } else if (shapeType === 1){
      shape = `<line x1="${w*0.12}" y1="${h*0.82}" x2="${w*0.88}" y2="${h*0.18}" stroke="rgb(${line},${line},${line})" stroke-width="1.5"/>`;
    } else {
      shape = `<rect x="${w*0.28}" y="${h*0.28}" width="${w*0.42}" height="${h*0.42}" fill="none" stroke="rgb(${line},${line},${line})" stroke-width="1.5"/>`;
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`
      + `<rect width="100%" height="100%" fill="rgb(${bg},${bg},${bg - 4})"/>${shape}</svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  // 실제로 화면에 렌더링되는 게시글 목록. 폴더 연결 전이거나 아직 쓴 글이 없으면 빈 배열이고,
  // 폴더 연결에 성공하면 posts/manifest.json에서 읽은 real posts(실제 글)로 교체됩니다.
  let posts = [];
  let usingRealPosts = false;   // 실제 posts 폴더를 읽어서 쓰고 있는지 여부

  // 카테고리 목록 — site-config.json(설정 페이지에서 관리)을 불러오기 전엔 기본값 사용
  let categories = DEFAULT_CATEGORIES.slice();

  // 자주 사용하는 DOM 요소를 미리 찾아둠
  const grid = document.getElementById('grid');
  const pageTitle = document.getElementById('pageTitle');
  const searchInput = document.getElementById('searchInput');
  const recentList = document.getElementById('recentList');

  // 상단에 보여줄 제목. total/about은 고정 문구, 나머지(카테고리)는 이름을 그대로 씀
  function labelFor(filter){
    if (filter === 'total') return 'Total';
    if (filter === 'about') return 'About';
    return filter;
  }

  let currentFilter = 'total';   // 현재 선택된 카테고리 (total/<카테고리 이름>/<하위 카테고리 이름>/about)

  // 사이드바 카테고리 옆에 표시되는 게시글 개수를 posts 배열 기준으로 계산해서 채움
  function updateCounts(){
    const counts = {};
    posts.forEach(p => { counts[p.category] = (counts[p.category] || 0) + 1; });
    document.getElementById('totalCount').textContent = posts.length;
    document.querySelectorAll('.category-sub a[data-filter]').forEach(a => {
      const f = a.dataset.filter;
      if (f === 'about') return;
      const countEl = a.querySelector('.count');
      if (!countEl) return;
      const total = categoryNamesForFilter(categories, f).reduce((sum, name) => sum + (counts[name] || 0), 0);
      countEl.textContent = total;
    });
  }

  // 사이드바의 카테고리 목록(Total 아래, About 위)을 categories 배열 기준으로 다시 그림
  // (하위 카테고리가 있으면 그 아래 한 단계 더 들여써서 표시)
  // + 각 항목에 클릭 이벤트를 다시 연결함 (설정에서 카테고리가 바뀌면 이 함수를 다시 호출)
  function renderCategorySidebar(){
    const sub = document.getElementById('categorySubList');
    sub.innerHTML = categories.map(cat => `
      <li>
        <a href="#" data-filter="${escapeHtml(cat.name)}">${escapeHtml(cat.name)} <span class="count">0</span></a>
        ${cat.subcategories.length ? `
          <ul class="category-sub-nested">
            ${cat.subcategories.map(sc => `
              <li><a href="#" data-filter="${escapeHtml(sc)}">${escapeHtml(sc)} <span class="count">0</span></a></li>
            `).join('')}
          </ul>
        ` : ''}
      </li>
    `).join('') + `<li><a href="#" data-filter="about">About</a></li>`;
    sub.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        setActive(a.dataset.filter);
      });
    });
    updateCounts();
  }

  // "최근 글" 영역: 날짜순으로 정렬해 최신 5개만 사이드바에 표시
  // (실제 글은 filename이 있으므로 posts/파일명으로 이동, 샘플 글은 그냥 #)
  function renderRecent(){
    const recent = [...posts].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 5);
    recentList.innerHTML = recent.map(p => `
      <li>
        <a href="${p.filename ? 'posts/' + postRelPath(p) : '#'}">
          <div class="recent-title">${p.title}</div>
          <div class="recent-date">${p.date}</div>
        </a>
      </li>
    `).join('');
  }

  // 게시글 카드 1개의 HTML을 만들어 반환 (main 그리드에 들어가는 카드)
  // 실제 글(filename 있음)은 posts/파일명.html로 이동하는 링크로 감싸고,
  // 샘플 글(filename 없음)은 클릭해도 이동하지 않도록 함
  function cardHTML(p){
    const href = p.filename ? 'posts/' + postRelPath(p) : '#';
    const thumbSrc = p.thumbnail ? 'posts/' + p.thumbnail : placeholderDataUri(p.seed);
    return `
      <article class="card" data-category="${p.category}" data-title="${p.title.toLowerCase()}">
        <a class="card-link" href="${href}">
          <div class="card-img"><img src="${thumbSrc}" alt="${p.title}" loading="lazy"></div>
          <div class="card-tag">${p.category}</div>
          <h3>${p.title}</h3>
          <p>${p.excerpt}</p>
          <div class="card-date">${p.date}</div>
        </a>
      </article>
    `;
  }

  // "About" 카테고리를 선택했을 때 그리드 대신 보여줄 자기소개 카드
  function aboutCardHTML(){
    return `
      <div class="about-card">
        <div class="profile-avatar"><img src="assets/profile-photo.jpg" alt="프로필 사진"></div>
        <h2>Yeonnnn</h2>
        <p>
          안녕하세요. Yeonnnn입니다. <br>개발을 공부하고 있는 부트캠프 수강생입니다. 이 곳은 부트캠프에서 무엇을 배웠는지,
          <br>어떤 방식으로 작업하는지, 어디서 막혔는지를 담는 공간입니다.
        </p>
        <div class="profile-links">
          <a href="https://instagram.com/whyeonik" target="_blank" rel="noopener">Instagram</a>
          <a href="mailto:zging0151@gmail.com">Email</a>
          <a href="https://github.com/Choyeonik" target="_blank" rel="noopener">Github</a>
        </div>
      </div>
    `;
  }

  // 현재 카테고리(currentFilter) + 검색어(searchInput)를 기준으로
  // posts를 걸러서 메인 그리드를 다시 그림. 카테고리/검색 버튼을 누를 때마다 호출됨
  function render(){
    const query = searchInput.value.trim().toLowerCase();

    if (currentFilter === 'about'){
      // About은 카드 여러 개가 아니라 내용 하나이므로 다단(masonry) 모드를 잠시 끔
      grid.classList.add('grid--single');
      grid.innerHTML = aboutCardHTML();
      return;
    }

    let filtered = posts;
    if (currentFilter !== 'total'){
      const names = categoryNamesForFilter(categories, currentFilter);
      filtered = posts.filter(p => names.includes(p.category));
    }
    if (query) filtered = filtered.filter(p => p.title.toLowerCase().includes(query));

    if (filtered.length === 0){
      grid.classList.add('grid--single');
      const message = query || currentFilter !== 'total'
        ? '검색 결과가 없습니다.'
        : '아직 작성된 글이 없습니다. "새 글 쓰기"에서 첫 글을 작성해보세요.';
      grid.innerHTML = `<div class="no-result">${message}</div>`;
      return;
    }

    grid.classList.remove('grid--single');   // 카드 목록을 보여줄 때는 다시 다단 레이아웃으로
    grid.innerHTML = filtered.map(cardHTML).join('');
  }

  // 사이드바에서 카테고리를 클릭했을 때: 활성 상태 표시 + 상단 제목 변경 + 그리드 다시 렌더링
  function setActive(filter){
    currentFilter = filter;
    document.querySelector('.category-total').classList.toggle('active', filter === 'total');
    document.querySelectorAll('.category-sub a').forEach(a => {
      a.classList.toggle('active', a.dataset.filter === filter);
    });
    pageTitle.textContent = labelFor(filter);
    render();
  }

  // ---------- 카테고리 클릭 이벤트 연결 ----------
  // (하위 카테고리 항목의 클릭 이벤트는 renderCategorySidebar()가 목록을 그릴 때마다 다시 연결함)
  document.querySelector('.category-total').addEventListener('click', () => setActive('total'));

  // ---------- 검색창 입력 이벤트 연결 (입력할 때마다 실시간으로 필터링) ----------
  searchInput.addEventListener('input', render);

  // ---------- 사이드바 최소화(토글) 버튼 ----------
  // body에 "sidebar-collapsed" 클래스를 토글 -> CSS의
  // "body.sidebar-collapsed .sidebar{ width:60px; ... }" 규칙이 사이드바를 좁게 접거나 다시 펼침
  // (버튼은 항상 보이는 상태로 남아있어서 다시 눌러 펼칠 수 있음)
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.body.classList.toggle('sidebar-collapsed');
  });

  renderCategorySidebar();   // DEFAULT_CATEGORIES 기준으로 카테고리 목록 최초 렌더링

  // ==========================================================
  // posts 폴더 연동 (write.html에서 저장한 실제 글 불러오기)
  // - site-storage.js의 헬퍼(getSiteFolderHandle, connectSiteFolder, getPostsDirHandle,
  //   readJSON)를 사용해 posts/manifest.json을 읽고, 화면의 posts 배열을 통째로 교체합니다.
  // - manifest.json이 아직 없다면(한 번도 글을 저장한 적 없음) 샘플 글을 그대로 둡니다.
  // ==========================================================
  const folderConnectEl = document.getElementById('folderConnect');
  const connectFolderBtn = document.getElementById('connectFolderBtn');

  // manifest.json의 게시글 1개를, 화면(cardHTML/renderRecent)이 기대하는 모양으로 변환
  // - date: "2026-08-20" -> "2026.08.20" (샘플 데이터와 표기 통일)
  // - excerpt: manifest의 description 필드를 그대로 사용
  // - seed: 썸네일 플레이스홀더 생성용 값으로 slug(파일명 기준 고유값) 사용
  function manifestEntryToPost(entry){
    return {
      id: entry.filename,
      category: entry.category,
      title: entry.title,
      excerpt: entry.description || '',
      date: String(entry.date || '').replace(/-/g, '.'),
      seed: entry.slug || entry.filename,
      filename: entry.filename,
      folder: entry.folder || [],   // posts 폴더 기준 카테고리 하위 폴더 경로 (없으면 posts 바로 아래)
      thumbnail: entry.thumbnail || null   // posts 폴더 기준 썸네일 사진 경로 (없으면 무늬 플레이스홀더 사용)
    };
  }

  // 폴더 핸들을 받아 site-config.json(카테고리 목록)을 읽고 화면에 반영
  async function applySiteConfig(siteHandle){
    const config = await loadSiteConfig(siteHandle);
    categories = config.categories;
    renderCategorySidebar();
  }

  // 폴더 핸들을 받아 posts/manifest.json을 읽고, 성공하면 화면 데이터를 실제 글로 교체
  async function loadRealPosts(siteHandle){
    const postsDir = await getPostsDirHandle(siteHandle, { create: false }).catch(() => null);
    if (!postsDir) return false;               // posts 폴더 자체가 아직 없음(글을 한 번도 저장 안 함)
    const manifest = await readJSON(postsDir, 'manifest.json');
    if (!manifest || !Array.isArray(manifest) || manifest.length === 0) return false;

    posts = manifest.map(manifestEntryToPost);
    usingRealPosts = true;
    updateCounts();
    renderRecent();
    render();
    return true;
  }

  function setFolderStatus(text, ok){
    folderConnectEl.innerHTML = ok
      ? `<span class="status-ok">${text}</span>`
      : `<button type="button" id="connectFolderBtn">${text}</button>`;
    const btn = document.getElementById('connectFolderBtn');
    if (btn) btn.addEventListener('click', onConnectFolderClick);
  }

  // "폴더 연결해서 실제 글 불러오기" 버튼 클릭 시: 폴더 선택창을 띄우고, 선택되면 바로 글 목록 교체
  async function onConnectFolderClick(){
    if (!isFsaSupported()){
      setFolderStatus('이 브라우저는 폴더 연결 기능을 지원하지 않습니다 (Chrome/Edge 사용)', false);
      return;
    }
    try{
      setFolderStatus('연결 중…', false);
      const handle = await connectSiteFolder();
      await applySiteConfig(handle).catch(() => {});
      const loaded = await loadRealPosts(handle);
      setFolderStatus(loaded ? '실제 글 연동됨' : '폴더 연결됨 (아직 저장된 글 없음)', true);
    } catch(e){
      // 사용자가 폴더 선택을 취소한 경우 등
      setFolderStatus('폴더 연결해서 실제 글 불러오기', false);
    }
  }

  connectFolderBtn.addEventListener('click', onConnectFolderClick);

  // 페이지를 열 때, 이전에 연결해둔 폴더가 있고 권한이 아직 살아있으면(=사용자 동작 없이도
  // 확인 가능한 queryPermission) 조용히 자동으로 실제 글을 불러옵니다.
  // 권한이 만료됐다면 억지로 팝업을 띄우지 않고(브라우저가 막음) 버튼을 그대로 둡니다.
  async function tryAutoConnect(){
    if (!isFsaSupported()) return;
    const handle = await getSiteFolderHandle({ promptIfNeeded: false });
    if (!handle) return;
    await applySiteConfig(handle).catch(() => {});
    const loaded = await loadRealPosts(handle);
    setFolderStatus(loaded ? '실제 글 연동됨' : '폴더 연결됨 (아직 저장된 글 없음)', true);
  }

  // 개별 글 페이지의 사이드바(카테고리/검색)에서 index.html?filter=... 또는 ?q=...로
  // 넘어왔을 때, 그 조건을 그대로 반영해서 보여줌
  function applyUrlParams(){
    const params = new URLSearchParams(location.search);
    const filter = params.get('filter');
    const q = params.get('q');
    if (q) searchInput.value = q;
    if (filter) setActive(filter);       // setActive 안에서 render()까지 호출됨
    else if (q) render();
  }

  // ---------- 초기 실행 ----------
  updateCounts();   // 사이드바 카테고리 옆 숫자(개수) 채우기
  renderRecent();   // "최근 글" 리스트 채우기
  render();         // 메인 그리드에 게시글 카드 렌더링
  tryAutoConnect().finally(applyUrlParams);   // 실제 글/카테고리를 불러온 뒤에 URL의 필터/검색어를 적용
</script>

</body>
</html>
